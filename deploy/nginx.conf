# Single entry point for both services.
#   /api/v1/alerts...               -> alert-service
#   /alert-service/health|metrics   -> alert-service /health|/metrics
#   everything else (incl. /health) -> ingest-service

# Resolve service names through Docker's DNS on every request (cached 10 s), so a redeployed container
# with a new IP is picked up without restarting nginx. Using variables in proxy_pass forces this.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 2m;

    set $ingest http://ingest-service:8080;
    set $alerts http://alert-service:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/v1/alerts {
        proxy_pass $alerts;
    }

    location /alert-service/ {
        rewrite ^/alert-service/(.*)$ /$1 break;
        proxy_pass $alerts;
    }

    location / {
        proxy_pass $ingest;
    }
}
