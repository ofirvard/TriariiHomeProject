# Stage Verify: smoke-test the deployment on the VM through nginx. If it fails, the VM is rolled back to the
# previous deployment automatically and the pipeline fails. Only if it passes, tag the build with the next
# version. Both images share one version, which goes up by one minor version per release (v0.1.0, v0.2.0,
# ...); the verified images are re-tagged in the registry (no rebuild) and a GitHub Release with generated
# notes creates the matching git tag. Last, the VM's app-version label shows that version.
name: Verify

on:
  workflow_call:
    inputs:
      image_tag:
        description: Tag of the images to verify, normally the commit SHA
        required: true
        type: string
      release:
        description: Tag a version if the smoke test passes (false for the rollback drill)
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/ofirvard/triariihomeproject

jobs:
  smoke-test:
    name: Smoke test on the VM
    runs-on: [self-hosted, rf-vm]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Smoke test
        id: smoke
        run: bash deploy/smoke-test.sh http://localhost

      - name: Show logs on failure
        if: failure()
        working-directory: /opt/rf-alert-manager
        run: docker compose logs --tail 200

      - uses: docker/login-action@v3
        if: failure() && steps.smoke.outcome == 'failure'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Roll back to the previous deployment
        if: failure() && steps.smoke.outcome == 'failure'
        run: bash deploy/deploy.sh --previous

  tag:
    name: Tag version
    needs: smoke-test
    if: inputs.release
    runs-on: ubuntu-24.04
    # One tagging run at a time, so two builds never take the same version.
    concurrency: tag-version
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # all tags, to find the latest version

      - name: Choose the version
        id: version
        env:
          SHA: ${{ inputs.image_tag }}
        run: |
          # A re-run for an already tagged commit keeps its version instead of taking a new one.
          existing=$(git tag --points-at "$SHA" --list 'v*.*.*' | head -1)
          if [[ -n "$existing" ]]; then
            { echo "version=$existing"; echo "new=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
          if [[ -z "$latest" ]]; then
            next="v0.1.0"
          else
            IFS=. read -r major minor _ <<< "${latest#v}"
            next="v${major}.$((minor + 1)).0"
          fi
          { echo "version=$next"; echo "previous=$latest"; echo "new=true"; } >> "$GITHUB_OUTPUT"
          echo "Tagging $next (previous: ${latest:-none})"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the verified images with the version and latest
        env:
          SHA: ${{ inputs.image_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for service in ingest-service alert-service; do
            docker buildx imagetools create \
              -t "$REGISTRY/$service:$VERSION" \
              -t "$REGISTRY/$service:latest" \
              "$REGISTRY/$service:$SHA"
          done

      - name: Create the GitHub Release and git tag
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.image_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          # Notes list the pull requests merged since the previous version.
          gh release create "$VERSION" --target "$SHA" --title "$VERSION" --generate-notes \
            ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}

  label:
    name: Show the version on the VM
    needs: tag
    runs-on: [self-hosted, rf-vm]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set the app-version label
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: bash deploy/label-version.sh "$VERSION"
