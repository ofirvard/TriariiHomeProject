# Stage: run the full stack from the images with the given tag and smoke-test it through nginx.
# When the VM exists, the deploy stage will run the same smoke test against it.
name: Verify

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to verify, normally the commit SHA
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify published images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack with the images to verify
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          {
            echo "DB_USER=rf"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "RABBITMQ_USER=rf"
            echo "RABBITMQ_PASSWORD=$(openssl rand -hex 16)"
            echo "IMAGE_TAG=$IMAGE_TAG"
          } > .env
          docker compose pull ingest-service alert-service
          docker compose up -d --no-build --wait

      - name: Smoke test
        run: deploy/smoke-test.sh http://localhost

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200
