# Rollback: Actions -> Rollback -> Run workflow. Redeploys an earlier image on the VM and smoke-tests it.
# Leave the version empty to go back to the one that ran before the last deploy, or give any published tag
# (v0.2.0, a commit SHA). Every verified build stays in GHCR, so nothing is rebuilt.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to deploy (empty = the previous deployment)
        required: false
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    name: Roll back the VM
    runs-on: [self-hosted, rf-vm]
    concurrency: deploy-vm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy the earlier version
        env:
          VERSION: ${{ inputs.version }}
        run: bash deploy/deploy.sh "${VERSION:---previous}"

      - name: Smoke test
        run: bash deploy/smoke-test.sh http://localhost

      - name: Show logs on failure
        if: failure()
        working-directory: /opt/rf-alert-manager
        run: docker compose logs --tail 200
