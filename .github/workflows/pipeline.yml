# The pipeline: the only workflow with triggers. Each stage is its own reusable workflow; this file decides
# which stages run. Pull requests run CI only; a merge to main runs CI -> publish -> verify -> release.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      image_tag: ${{ github.sha }}

  verify:
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/verify.yml
    with:
      image_tag: ${{ github.sha }}

  # Only verified builds get a version. One release at a time, so two merges never take the same version.
  release:
    needs: verify
    concurrency: release
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      image_tag: ${{ github.sha }}
