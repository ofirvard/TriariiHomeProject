# The pipeline. Each stage is its own reusable workflow.
#   pull request        CI
#   merge to main       CI -> Build & Publish -> Verify (smoke test, then tag the version)
#   manual (on main)    Actions -> "Pipeline" -> Run workflow: the same as a merge
name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      package: ${{ github.event_name != 'pull_request' }}

  build-publish:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-publish.yml
    with:
      image_tag: ${{ github.sha }}

  verify:
    needs: build-publish
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/verify.yml
    with:
      image_tag: ${{ github.sha }}
