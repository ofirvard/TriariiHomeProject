name: CI/CD

# Feature branches are checked through their pull request; pushes to main (merges) run the full pipeline.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # GHCR image names must be lowercase.
  REGISTRY: ghcr.io/ofirvard/triariihomeproject

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Checkstyle + unit tests + integration tests (Testcontainers: real Postgres and RabbitMQ)
      - name: Lint and test
        run: ./gradlew check

      - name: Lint shell scripts
        run: shellcheck simulator.sh deploy/smoke-test.sh

      - name: Keep test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "*/build/reports/"

  publish:
    name: Build and publish ${{ matrix.service }}
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ingest-service, alert-service]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Runs the exact images just published, as a full stack on the runner, and smoke-tests them.
  # When the VM exists, a deploy job will run the same smoke test against it.
  verify:
    name: Verify published images
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack with the images of this commit
        run: |
          {
            echo "DB_USER=rf"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "RABBITMQ_USER=rf"
            echo "RABBITMQ_PASSWORD=$(openssl rand -hex 16)"
            echo "IMAGE_TAG=${{ github.sha }}"
          } > .env
          docker compose pull ingest-service alert-service
          docker compose up -d --no-build --wait

      - name: Smoke test
        run: deploy/smoke-test.sh http://localhost

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200
