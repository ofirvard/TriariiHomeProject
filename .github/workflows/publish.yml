# Stage: package both images from the jars CI built and push them to GHCR, tagged with the given tag
# (the commit SHA) and latest. Docker layers are cached, so an unchanged jar is not re-packaged.
name: Publish

on:
  workflow_call:
    inputs:
      image_tag:
        description: Tag for the images, normally the commit SHA
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  # GHCR image names must be lowercase.
  REGISTRY: ghcr.io/ofirvard/triariihomeproject

jobs:
  publish:
    name: Build and publish ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [ingest-service, alert-service]
    steps:
      - uses: actions/checkout@v5

      - name: Get the jars built by CI
        uses: actions/download-artifact@v4
        with:
          name: jars

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ inputs.image_tag }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
